# Command permission sets per window (the allow-* permissions are generated by build.rs).

[[set]]
identifier = "main-window"
description = "All CaptureOne commands, for the main window."
permissions = ["allow-get-capabilities", "allow-get-permission-status", "allow-request-permission", "allow-open-permission-settings", "allow-list-sources", "allow-get-source-thumbnail", "allow-list-audio-devices", "allow-take-screenshot", "allow-start-recording", "allow-pause-recording", "allow-resume-recording", "allow-stop-recording", "allow-cancel-recording", "allow-get-recording-status", "allow-get-active-session", "allow-select-region", "allow-region-selection-done", "allow-library-list", "allow-library-rename", "allow-library-delete", "allow-library-export", "allow-library-reveal", "allow-library-validate", "allow-library-storage", "allow-recover-recordings", "allow-get-settings", "allow-save-settings", "allow-get-diagnostics", "allow-hub-status", "allow-hub-set-enabled", "allow-hub-regenerate-code", "allow-discovery-scan", "allow-tv-pair", "allow-tv-send-key", "allow-tv-screenshot"]

[[set]]
identifier = "indicator-window"
description = "Recording indicator bar: read the active session, pause/resume/stop."
permissions = ["allow-get-active-session", "allow-get-recording-status", "allow-pause-recording", "allow-resume-recording", "allow-stop-recording"]

[[set]]
identifier = "region-window"
description = "Region selector overlay: frozen display frame and returning the selection."
permissions = ["allow-get-source-thumbnail", "allow-region-selection-done"]
