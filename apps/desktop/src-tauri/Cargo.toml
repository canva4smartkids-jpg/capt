[package]
name = "captureone-desktop"
description = "CaptureOne desktop app (Tauri 2)"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "captureone-desktop"

[lib]
name = "captureone_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "captureone-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
capture-core.workspace = true
media-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
uuid.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
tauri = { version = "2.12", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-log = "2.10"
rusqlite = { version = "0.41", features = ["bundled"] }
fs4 = "1.1"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.4"

[target.'cfg(target_os = "linux")'.dependencies]
linux-capture.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture-backend.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
macos-capture.workspace = true

[dev-dependencies]
tempfile = "3"
