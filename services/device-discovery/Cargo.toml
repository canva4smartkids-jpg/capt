[package]
name = "device-discovery"
description = "LAN discovery and control of TVs (SSDP, mDNS, LG SSAP, Samsung remote)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
capture-core.workspace = true
# Protocol types only (DeviceKind, DiscoveredDevice...); no server.
companion-hub = { path = "../companion-hub", default-features = false }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
parking_lot.workspace = true
image.workspace = true
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15"
mdns-sd = { version = "0.21", default-features = false }
roxmltree = "0.21"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"

[dev-dependencies]
jsonschema = { version = "0.60", default-features = false }
tempfile = "3"
rcgen = "0.14"
